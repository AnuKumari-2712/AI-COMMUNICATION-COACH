services:
  - type: web
    name: ai-comm-coach-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CORS_ORIGINS
        value: '["http://localhost:5173"]'
      - key: USE_MOCK_AI
        value: "true"
      - key: JWT_SECRET
        generateValue: true
